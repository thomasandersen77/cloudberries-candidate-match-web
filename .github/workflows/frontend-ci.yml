# .github/workflows/frontend-ci.yml
name: Frontend CI

# This workflow runs on pushes to any branch and on pull requests targeting the main branch.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # This job runs on push and PR to check for basic correctness
  build:
    name: Build and Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # --- Steg 1: Kode-oppsett ---
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Henter hele historikken for å kunne sammenligne branches

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # The suite never ran in CI; lint and build passing said nothing about behaviour.
      - name: Run unit tests
        run: npm test

      # The types are generated from the checked-in contract. A hand edit to generated.ts, or a
      # spec copied without regenerating, fails here instead of as missing data in a browser.
      - name: Check generated API types match openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/generated.ts

      - name: Validate staticwebapp.config.json (public)
        run: |
          test -f public/staticwebapp.config.json
          node -e "JSON.parse(require('fs').readFileSync('public/staticwebapp.config.json','utf8'))"

      - name: Build application
        run: npm run build

      - name: Show SWA config in build output
        run: |
          ls -la build || ls -la dist || true
          echo "----- staticwebapp.config.json (from build) -----"
          if [ -f build/staticwebapp.config.json ]; then cat build/staticwebapp.config.json; fi
          if [ -f dist/staticwebapp.config.json ]; then cat dist/staticwebapp.config.json; fi
          node -e "const fs=require('fs');const p=fs.existsSync('build/staticwebapp.config.json')?'build/staticwebapp.config.json':'dist/staticwebapp.config.json';JSON.parse(fs.readFileSync(p,'utf8'));"

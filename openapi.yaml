  /admin/ai/models:
    get:
      tags: [ Admin ]
      summary: Get configured AI model tiers
      description: >
        Returns the resolved Anthropic model names per tier (FAST, DEFAULT, QUALITY) and a flag
        indicating whether QUALITY currently falls back to the DEFAULT model
        (i.e. when ANTHROPIC_QUALITY_MODEL is not configured). Never returns the API key.
      responses:
        '200':
          description: Configured model tiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModelsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  parameters:
    PageParam:
      in: query
      name: page
      description: Page number (0-indexed)
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      in: query
      name: size
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    SortParam:
      in: query
      name: sort
      description: Sort field(s), e.g. `name,asc`. Repeat for multi-sort.
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    UseHighestQualityModelParam:
      in: query
      name: useHighestQualityModel
      required: false
      schema:
        type: boolean
        default: false
      description: >
        When true, backend requests the configured QUALITY model tier for this operation.
        The concrete model is configured server-side via ANTHROPIC_QUALITY_MODEL.
        If no quality model is configured, backend falls back to the default model.
    ModelTierParam:
      in: query
      name: modelTier
      required: false
      schema:
        type: string
        enum: [ FAST, DEFAULT, QUALITY ]
      description: >
        Explicit model tier for the LLM call. When provided, takes precedence over
        `useHighestQualityModel`. FAST = fastest/cheapest, DEFAULT = balanced, QUALITY = highest quality.
        If omitted, the backend picks an operation-appropriate default.
    CvWeightPercentParam:
      in: query
      name: cvWeightPercent
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
      description: >
        Percentage weight (0–100) given to CV quality when combining with skill match.
        The remaining percentage is given to skill match. Frontend typically offers
        20, 30, 60 or 80. If omitted, the server default (50) is used.

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    AiModelsResponse:
      type: object
      required: [ provider, fastModel, defaultModel, qualityModel, qualityConfigured, qualityFallsBackToDefault, availableModelsSource ]
      properties:
        provider: { type: string, example: ANTHROPIC }
        fastModel: { type: string, description: "Resolved model name for the FAST tier" }
        defaultModel: { type: string, description: "Resolved model name for the DEFAULT tier" }
        qualityModel: { type: string, description: "Resolved model name for the QUALITY tier (falls back to defaultModel when not configured)" }
        qualityConfigured: { type: boolean, description: "True when ANTHROPIC_QUALITY_MODEL is explicitly configured (different from defaultModel)" }
        qualityFallsBackToDefault: { type: boolean, description: "True when QUALITY tier currently resolves to the DEFAULT model" }
        availableModelsSource: { type: string, example: configuration }

    AnthropicUsageResponse:
      type: object
      properties:
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheCreationTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        totalInputTokens: { type: integer, format: int64 }
        cacheHitRate: { type: number, format: double }
        estimatedCostUsd: { type: number, format: double }

    AIAnalysisRequest:
      type: object
      required: [ content ]
      properties:
        content: { type: string, description: Content to analyze }

    AIResponseModel:
      type: object
      properties:
        content: { type: string }
        modelUsed: { type: string }

    RagChatRequest:
      type: object
      required: [ message ]
      properties:
        message: { type: string }
        topK: { type: integer, default: 4 }
        similarityThreshold: { type: number, format: double, default: 0.7 }
        filter: { type: string, nullable: true }

    RagChatResponse:
      type: object
      properties:
        answer: { type: string }
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceDocument'

    SourceDocument:
      type: object
      properties:
        id: { type: string, nullable: true }
        contentPreview: { type: string }
        metadata:
          type: object
          additionalProperties: true

    RagIngestRequest:
      type: object
      required: [ candidateId, cvText ]
      properties:
        candidateId: { type: integer, format: int64 }
        name: { type: string, nullable: true }
        cvText: { type: string }

    SkillConsultantRankingDto:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        role: { type: string, nullable: true }
        office: { type: string, nullable: true }
        bornYear: { type: integer, nullable: true }
        defaultCvId: { type: string, nullable: true }
        skill: { type: string }
        skillScore: { type: number, format: double }
        durationYears: { type: integer }
        projectHitCount: { type: integer }
        latestUsedYearMonth: { type: string, nullable: true }
        cvQualityScore: { type: integer, nullable: true }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/SkillEvidenceDto'

    SkillEvidenceDto:
      type: object
      properties:
        source: { type: string }
        skillName: { type: string }
        customer: { type: string, nullable: true }
        projectDescription: { type: string, nullable: true }
        fromYearMonth: { type: string, nullable: true }
        toYearMonth: { type: string, nullable: true }
        durationYears: { type: integer, nullable: true }

    ConsultantSummaryDto:
      type: object
      required: [ userId, name, email, bornYear, defaultCvId ]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        bornYear: { type: integer }
        defaultCvId: { type: string }

    PageConsultantSummaryDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ConsultantSummaryDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }

    ConsultantWithCvDto:
      type: object
      required: [ userId, name, cvId, skills, cvs ]
      properties:
        id: { type: integer, format: int64, nullable: true }
        userId: { type: string }
        name: { type: string }
        cvId: { type: string }
        skills:
          type: array
          items: { type: string }
        cvs:
          type: array
          items: { $ref: '#/components/schemas/ConsultantCvDto' }

    ConsultantCvDto:
      type: object
      required: [ active, industries ]
      properties:
        id: { type: integer, format: int64, nullable: true }
        versionTag: { type: string, nullable: true }
        qualityScore: { type: integer, nullable: true }
        active: { type: boolean }
        industries:
          type: array
          items: { type: string }
        keyQualifications:
          type: array
          items: { $ref: '#/components/schemas/KeyQualificationDto' }
        education:
          type: array
          items: { $ref: '#/components/schemas/EducationDto' }
        workExperience:
          type: array
          items: { $ref: '#/components/schemas/WorkExperienceDto' }
        projectExperience:
          type: array
          items: { $ref: '#/components/schemas/ProjectExperienceDto' }
        certifications:
          type: array
          items: { $ref: '#/components/schemas/CertificationDto' }
        courses:
          type: array
          items: { $ref: '#/components/schemas/CourseDto' }
        languages:
          type: array
          items: { $ref: '#/components/schemas/LanguageDto' }
        skillCategories:
          type: array
          items: { $ref: '#/components/schemas/SkillCategoryDto' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentDto' }

    KeyQualificationDto:
      type: object
      properties:
        label: { type: string, nullable: true }
        description: { type: string, nullable: true }

    EducationDto:
      type: object
      properties:
        degree: { type: string, nullable: true }
        school: { type: string, nullable: true }
        fromYearMonth: { type: string, nullable: true }
        toYearMonth: { type: string, nullable: true }

    WorkExperienceDto:
      type: object
      properties:
        employer: { type: string, nullable: true }
        fromYearMonth: { type: string, nullable: true }
        toYearMonth: { type: string, nullable: true }

    ProjectExperienceDto:
      type: object
      properties:
        customer: { type: string, nullable: true }
        description: { type: string, nullable: true }
        longDescription: { type: string, nullable: true }
        fromYearMonth: { type: string, nullable: true }
        toYearMonth: { type: string, nullable: true }
        roles:
          type: array
          items: { $ref: '#/components/schemas/ProjectRoleDto' }
        skills:
          type: array
          items: { type: string }

    ProjectRoleDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }

    CertificationDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        year: { type: integer, nullable: true }

    CourseDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        organizer: { type: string, nullable: true }
        year: { type: integer, nullable: true }

    LanguageDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        level: { type: string, nullable: true }

    SkillCategoryDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillInCategoryDto' }

    SkillInCategoryDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        durationYears: { type: integer, nullable: true }

    AttachmentDto:
      type: object
      properties:
        fileName: { type: string, nullable: true }
        url: { type: string, nullable: true }

    PageResponseConsultantWithCvDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ConsultantWithCvDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }

    PageConsultantWithCvDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ConsultantWithCvDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }

    RelationalSearchRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        skillsAll:
          type: array
          items: { type: string }
        skillsAny:
          type: array
          items: { type: string }
        minQualityScore: { type: integer, nullable: true }
        onlyActiveCv: { type: boolean, default: false }
        pagination: { $ref: '#/components/schemas/PaginationDto' }

    SemanticSearchRequest:
      type: object
      required: [ text ]
      properties:
        text: { type: string }
        provider: { type: string, default: "GOOGLE_GEMINI" }
        model: { type: string, default: "gemini-embedding-001" }
        topK: { type: integer, default: 10 }
        minQualityScore: { type: integer, nullable: true }
        onlyActiveCv: { type: boolean, default: false }
        pagination: { $ref: '#/components/schemas/PaginationDto' }

    PaginationDto:
      type: object
      properties:
        page: { type: integer, default: 0 }
        size: { type: integer, default: 10 }
        sort:
          type: array
          items: { type: string }

    EmbeddingProviderInfo:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        dimension: { type: integer }
        enabled: { type: boolean }
        activeEmbeddingCount: { type: integer }
        semanticSearchReady: { type: boolean }
        totalConsultantCount: { type: integer, format: int64 }

    ProjectRequestSummaryDto:
      type: object
      required: [ id, customerName, createdAt ]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, nullable: true }
        customerName: { type: string }
        createdAt: { type: string, format: date-time }

    PagedMatchesListDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/MatchesListItemDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        currentPage: { type: integer }
        pageSize: { type: integer }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }

    MatchesListItemDto:
      type: object
      required: [ id, hitCount, coverageStatus, coverageLabel ]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        date: { type: string, format: date-time, nullable: true }
        deadlineDate: { type: string, format: date-time, nullable: true }
        hitCount: { type: integer, format: int64 }
        coverageStatus: { $ref: '#/components/schemas/CoverageStatus' }
        coverageLabel: { type: string }

    CoverageStatus:
      type: string
      enum: [ GREEN, YELLOW, RED, NEUTRAL ]

    MatchCandidateDto:
      type: object
      required: [ userId, name, cvId, score ]
      properties:
        userId: { type: string }
        name: { type: string }
        cvId: { type: string }
        score: { type: number, format: double, description: "Match score from 0.0 to 10.0" }
        scorePercent: { type: integer, description: "Match score from 0 to 100" }
        justification: { type: string, nullable: true }
        skills:
          type: array
          items: { type: string }
        email: { type: string, nullable: true }

    TriggerMatchingResponse:
      type: object
      required: [ projectRequestId, status, message ]
      properties:
        projectRequestId: { type: integer, format: int64 }
        status: { type: string }
        message: { type: string }
        jobId: { type: string, nullable: true }

    MatchStatusDto:
      type: object
      required: [ status ]
      properties:

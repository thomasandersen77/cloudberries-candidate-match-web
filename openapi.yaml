        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  parameters:
    PageParam:
      in: query
      name: page
      description: Page number (0-indexed)
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      in: query
      name: size
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    SortParam:
      in: query
      name: sort
      description: Sort field(s), e.g. `name,asc`. Repeat for multi-sort.
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    UseHighestQualityModelParam:
      in: query
      name: useHighestQualityModel
      required: false
      schema:
        type: boolean
        default: false
      description: >
        When true, backend requests the configured QUALITY model tier for this operation.
        The concrete model is configured server-side via ANTHROPIC_QUALITY_MODEL.
        If no quality model is configured, backend falls back to the default model.
    ModelTierParam:
      in: query
      name: modelTier
      required: false
      schema:
        type: string
        enum: [ FAST, DEFAULT, QUALITY ]
      description: >
        Explicit model tier for the LLM call. When provided, takes precedence over
        `useHighestQualityModel`. FAST = fastest/cheapest, DEFAULT = balanced, QUALITY = highest quality.
        If omitted, the backend picks an operation-appropriate default.
    CvWeightPercentParam:
      in: query
      name: cvWeightPercent
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
      description: >
        Percentage weight (0–100) given to CV quality when combining with skill match.
        The remaining percentage is given to skill match. Frontend typically offers
        20, 30, 60 or 80. If omitted, the server default (50) is used.

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    AiModelsResponse:
      type: object
      required: [ provider, fastModel, defaultModel, qualityModel, qualityConfigured, qualityFallsBackToDefault, availableModelsSource ]
      properties:
        provider: { type: string, example: ANTHROPIC }
        fastModel: { type: string, description: "Resolved model name for the FAST tier" }
        defaultModel: { type: string, description: "Resolved model name for the DEFAULT tier" }
        qualityModel: { type: string, description: "Resolved model name for the QUALITY tier (falls back to defaultModel when not configured)" }
        qualityConfigured: { type: boolean, description: "True when ANTHROPIC_QUALITY_MODEL is explicitly configured (different from defaultModel)" }
        qualityFallsBackToDefault: { type: boolean, description: "True when QUALITY tier currently resolves to the DEFAULT model" }
        availableModelsSource: { type: string, example: configuration }

    AnthropicUsageResponse:
      type: object
      properties:
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheCreationTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        totalInputTokens: { type: integer, format: int64 }
        cacheHitRate: { type: number, format: double }
        estimatedCostUsd: { type: number, format: double }

    ProjectRequestDocumentKind:
      type: string
      description: >
        What an uploaded project-request document actually is. One of the documents in this database
        is a consultancy's own proposal for a named consultant, and a matching run against it ranked
        that consultant near the top of his own competition. UNKNOWN means nobody has established
        which, and answers must say so rather than assume.
      enum: [ CUSTOMER_REQUEST, BID_RESPONSE, UNKNOWN ]

    SetDocumentKindRequest:
      type: object
      required: [ documentKind ]
      properties:
        documentKind: { $ref: '#/components/schemas/ProjectRequestDocumentKind' }

    ProjectRequestDocumentKindDto:
      type: object
      required: [ id, documentKind ]
      properties:
        id: { type: integer, format: int64 }
        documentKind: { $ref: '#/components/schemas/ProjectRequestDocumentKind' }

    ChatScope:
      type: string
      description: >
        Which material the chat may answer from. DATABASE uses consultants, CVs, customer requests
        and stored matching results. GENERAL answers from the model's own knowledge with no
        Candidate Match data retrieved or sent. Chosen per question and never inferred: a question
        naming a known technology is read as a consultant search, so "Hva er Kafka?" would be routed
        to a search, while a misspelled name finds nothing at all.
      enum: [ DATABASE, GENERAL ]
      default: DATABASE

    ChatAnalyzeRequest:
      type: object
      required: [ content ]
      properties:
        conversationId:
          type: string
          nullable: true
          description: Conversation to continue. Omit to start one; the server returns the id.
        content:
          type: string
          maxLength: 4000
          description: The question
        turnId:
          type: string
          nullable: true
          description: >
            Idempotency key for this attempt. Send the same value when retrying a question whose
            outcome is unknown — a network failure after the server answered — and the stored answer
            comes back instead of a second model call and a second turn.
        scope:
          allOf:
            - $ref: '#/components/schemas/ChatScope'
          default: DATABASE
        topK:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: >
            How many consultants a search may return. Each hit costs prompt tokens, because the
            model is given a summary card per consultant so it can cite them, so this is capped well
            below what a raw search endpoint would allow.
        pinnedRequestId:
          type: integer
          format: int64
          nullable: true
          description: >
            A request the reader picked from the alternatives on an earlier answer. Send the id from
            ChatReading.alternatives rather than re-sending the wording that was ambiguous, which
            would only reach the same ambiguity again.
        pinnedConsultantUserId:
          type: string
          nullable: true
          description: >
            A consultant the reader picked from the alternatives on an earlier answer, as the user
            id from ChatReading.alternatives. The same rule as pinnedRequestId: a first name that
            matched two people matches them both again when it is re-sent.

    ChatAnswerKind:
      type: string
      description: >
        What kind of answer this is. STORED_MATCH reports a result an earlier matching run produced;
        AD_HOC_EVALUATION is an opinion produced just now and not saved anywhere. GENERAL is the
        model's own knowledge, with no database content behind it.
      enum: [ FACTUAL, SEARCH_RESULT, STORED_MATCH, AD_HOC_EVALUATION, NO_GROUNDING, GENERAL ]

    ChatSourceKindDto:
      type: string
      enum: [ CONSULTANT, PROJECT_REQUEST, STORED_MATCH ]

    RetrievalMethodDto:
      type: string
      description: >
        How a consultant came to be on a list. Deliberately not called a match: in this system a
        match is a candidate scored against a request's requirements by the matching pipeline.
        EXACT_SKILLS is documented skill rows, SEMANTIC is vector similarity against CV sections,
        HYBRID is exact criteria filtering the pool with similarity ordering what is left.
      enum: [ EXACT_SKILLS, SEMANTIC, HYBRID ]

    DocumentedSkillDto:
      type: object
      required: [ name ]
      properties:
        name: { type: string }
        years:
          type: integer
          nullable: true
          description: >
            Years the CV records for it. Null means no duration is recorded, which the database
            expresses as either NULL or 0; both are normalised to null here, so null is unknown and
            never zero. Render it as unknown rather than as a number: 17% of skill rows have no
            duration, and an unrecorded one is not evidence of a short one.

    RetrievalDetailsDto:
      type: object
      required: [ method ]
      properties:
        method: { $ref: '#/components/schemas/RetrievalMethodDto' }
        documentedSkills:
          type: array
          items: { $ref: '#/components/schemas/DocumentedSkillDto' }
        cvQualityScore: { type: integer, nullable: true }
        semanticSimilarity:
          type: number
          format: double
          nullable: true
          description: >
            Cosine similarity for a vector search hit. Not a match percentage and must not be shown
            as one: two unrelated CVs sit around 0.80 with the current model, so the absolute value
            carries little and a small difference carries none. Use it for ordering.
        bestChunkLabel:
          type: string
          nullable: true
          description: The CV section that scored highest, for a vector search hit.

    ChatSource:
      type: object
      required: [ ref, kind, label ]
      properties:
        ref: { type: string, description: The reference the answer cites, e.g. K1 }
        kind: { $ref: '#/components/schemas/ChatSourceKindDto' }
        label: { type: string }
        consultantUserId: { type: string, nullable: true }
        consultantCvId: { type: string, nullable: true }
        projectRequestId: { type: integer, format: int64, nullable: true }
        originalFilename:
          type: string
          nullable: true
          description: The uploaded document a request came from. Its kind is not verified.
        matchResultId: { type: integer, format: int64, nullable: true }
        evaluatedAt: { type: string, format: date-time, nullable: true }
        retrieval:
          allOf:
            - $ref: '#/components/schemas/RetrievalDetailsDto'
          nullable: true
          description: Set on a consultant found by a search, for rendering a result card.

    ChatAnalyzeResponse:
      type: object
      required: [ conversationId, answer, answerKind, sources, modelUsed, latencyMs ]
      properties:
        conversationId: { type: string }
        answer: { type: string }
        answerKind: { $ref: '#/components/schemas/ChatAnswerKind' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/ChatSource' }
        comparison:
          type: array
          default: []
          description: >
            Per-consultant scores, present only when the turn ran a comparison and empty
            otherwise. Additive: a client that ignores it keeps working, and one that reads it can
            render a table without parsing the answer text.
          items: { $ref: '#/components/schemas/CandidateComparison' }
        requestFit:
          type: array
          default: []
          description: >
            Per-request scores, present only when the turn searched for requests that fit one
            consultant and empty otherwise. The mirror of comparison: one consultant and several
            requests, one score each. Produced by the same screening prompt, schema and tier as
            every other score in the product, and not stored: a run that is kept is one somebody
            started on purpose against a single request.
          items: { $ref: '#/components/schemas/RequestFit' }
        readings:
          type: array
          default: []
          description: >
            How the question's entities were read, when a reader has to be able to check or reject
            it: a corrected spelling, a tie between rows, or a reference that matched nothing.
            Additive like comparison. Typed rather than folded into the answer text because the
            corrections are made by the server and not by the model, and prose the model writes is
            prose the model can reword, bury or omit.
          items: { $ref: '#/components/schemas/ChatReading' }
        modelUsed: { type: string }
        latencyMs: { type: integer, format: int64 }

    RequestFit:
      type: object
      required: [ ref, projectRequestId, customerName ]
      description: One request a consultant was screened against.
      properties:
        ref:
          type: string
          description: Reference used in the answer text, e.g. A1
        projectRequestId: { type: integer, format: int64 }
        customerName: { type: string }
        role:
          type: string
          nullable: true
          description: The position the request asks for, when it names one
        score:
          type: number
          format: double
          nullable: true
          description: Screening score on the 0.0-10.0 scale, absent when this request was not scored
          example: 7.4
        summary: { type: string, nullable: true }
        notScoredReason: { type: string, nullable: true }

    ChatReading:
      type: object
      required: [ kind, written, status, origin ]
      description: One entity in the question and what became of it.
      properties:
        kind: { $ref: '#/components/schemas/ChatSourceKindDto' }
        written:
          type: string
          description: Exactly as the reader wrote it, never rewritten.
        readAs:
          type: string
          nullable: true
          description: What it was read as; absent when nothing matched.
        status:
          type: string
          enum: [ CORRECTED, AMBIGUOUS, NOT_FOUND ]
          description: >
            What happened to the reading. CORRECTED was placed but not as written; AMBIGUOUS means
            several rows fit and none wins; NOT_FOUND means nothing in the database matched.
        origin:
          type: string
          enum: [ DATABASE_EXACT, DATABASE_FUZZY, MODEL_SUGGESTED ]
          description: >
            How the reading was arrived at, which is a different question from how it turned out.
            Kept apart from status so a client can show an exact database hit and a model's proposal
            differently even when both end in CORRECTED.
        alternatives:
          type: array
          default: []
          description: >
            Candidates to choose between, with ids so that picking one is unambiguous. Empty when
            nothing matched: the whole index is not a list of near misses for a word that matched
            none of it.
          items: { $ref: '#/components/schemas/ChatReadingAlternative' }

    ChatReadingAlternative:
      type: object
      required: [ id, label ]
      properties:
        id:
          type: string
          description: Request id, or consultant user id, depending on the reading's kind.
        label: { type: string }

    CandidateComparison:
      type: object
      required: [ ref, consultantUserId, name ]
      description: >
        One consultant's screening score from a chat comparison. Produced by the same matching
        prompt, schema and tier as every other score in the product, so the numbers are comparable.
      properties:
        ref:
          type: string
          description: Reference used in the answer text, e.g. K1
        consultantUserId: { type: string }
        name: { type: string }
        score:
          type: number
          format: double
          nullable: true
          description: Screening score on the 0.0-10.0 scale, absent when this consultant was not scored
          example: 7.4
        summary:
          type: string
          nullable: true
        notScoredReason:
          type: string
          nullable: true
          description: >
            Set when the consultant could not be scored. The score is then absent rather than zero:
            a failed call is not a bad candidate, and ranking it last would be a claim the run
            cannot support.

    AIResponseModel:
      type: object
      properties:
        content: { type: string }
        modelUsed: { type: string }

    SkillConsultantRankingDto:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        role: { type: string, nullable: true }
        office: { type: string, nullable: true }
        bornYear: { type: integer, nullable: true }
        defaultCvId: { type: string, nullable: true }
        skill: { type: string }
        skillScore: { type: number, format: double }
        durationYears: { type: integer }
        projectHitCount: { type: integer }
        latestUsedYearMonth: { type: string, nullable: true }
        cvQualityScore: { type: integer, nullable: true }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/SkillEvidenceDto'

    SkillEvidenceDto:
      type: object
      properties:
        source: { type: string }
        skillName: { type: string }
        customer: { type: string, nullable: true }
        projectDescription: { type: string, nullable: true }
        fromYearMonth: { type: string, nullable: true }
        toYearMonth: { type: string, nullable: true }
        durationYears: { type: integer, nullable: true }

    ConsultantSummaryDto:
      type: object
      required: [ userId, name, email, bornYear, defaultCvId ]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        bornYear: { type: integer }
        defaultCvId: { type: string }

    ConsultantSyncResponse:
      type: object
      required: [ total, totalInDatabase, attempted, succeeded, failed, skipped, created, updated, skippedReasons, departed, returned ]
      properties:
        total: { type: integer }
        totalInDatabase: { type: integer, format: int64 }
        attempted: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skippedReasons:
          type: object
          additionalProperties:
            type: integer
        departed:
          type: integer
          description: People missing from Flowcase's user list this run. Marked as departed and kept, not deleted; they leave every search, pool and list.
        returned:
          type: integer
          description: People who had been marked departed and are on the list again; the mark is cleared.

    PageConsultantSummaryDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ConsultantSummaryDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }

    ConsultantWithCvDto:
      type: object
      required: [ userId, name, cvId, skills, cvs ]
      properties:
        id: { type: integer, format: int64, nullable: true }
        userId: { type: string }
        name: { type: string }
        cvId: { type: string }
        email: { type: string, nullable: true }
        office: { type: string, nullable: true }
        role: { type: string, nullable: true }
        qualityScore:
          type: integer
          nullable: true
          description: >-
            CV quality score 0-100 for the consultant's active CV, or the first CV that has one.
            Surfaced at the top level so result lists can show how sellable a CV is without
            unpacking the nested CV payload.
        skills:
          type: array
          items: { type: string }
        semanticScore:
          type: number
          format: double
          nullable: true
          description: >-
            Cosine similarity to the search query, 0..1 where 1 is identical. Set by semantic and
            hybrid search only; null for results that did not come from a vector search. Embedding
            models keep unrelated items well above 0, so read this relative to the rest of the
            result set rather than as an absolute percentage.
        cvs:
          type: array
          items: { $ref: '#/components/schemas/ConsultantCvDto' }

    ConsultantCvDto:
      type: object
      required: [ active, industries ]
      properties:
        id: { type: integer, format: int64, nullable: true }
        versionTag: { type: string, nullable: true }
        qualityScore: { type: integer, nullable: true }
        active: { type: boolean }
        industries:
          type: array
          items: { type: string }
        keyQualifications:
          type: array
          items: { $ref: '#/components/schemas/KeyQualificationDto' }
        education:
          type: array
          items: { $ref: '#/components/schemas/EducationDto' }
        workExperience:
          type: array
          items: { $ref: '#/components/schemas/WorkExperienceDto' }
        projectExperience:
          type: array
          items: { $ref: '#/components/schemas/ProjectExperienceDto' }
        certifications:
          type: array
          items: { $ref: '#/components/schemas/CertificationDto' }
        courses:
          type: array
          items: { $ref: '#/components/schemas/CourseDto' }
        languages:
          type: array
          items: { $ref: '#/components/schemas/LanguageDto' }
        skillCategories:
          type: array
          items: { $ref: '#/components/schemas/SkillCategoryDto' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentDto' }

    KeyQualificationDto:
      type: object
      properties:
        label: { type: string, nullable: true }
        description: { type: string, nullable: true }

    EducationDto:
      type: object
      properties:
        degree: { type: string, nullable: true }
        school: { type: string, nullable: true }
        fromYearMonth: { type: string, nullable: true }
        toYearMonth: { type: string, nullable: true }

    WorkExperienceDto:
      type: object
      properties:
        employer: { type: string, nullable: true }
        fromYearMonth: { type: string, nullable: true }
        toYearMonth: { type: string, nullable: true }

    ProjectExperienceDto:
      type: object
      properties:
        customer: { type: string, nullable: true }
        description: { type: string, nullable: true }
        longDescription: { type: string, nullable: true }
        fromYearMonth: { type: string, nullable: true }
        toYearMonth: { type: string, nullable: true }
        roles:
          type: array
          items: { $ref: '#/components/schemas/ProjectRoleDto' }
        skills:
          type: array
          items: { type: string }

    ProjectRoleDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }

    CertificationDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        year: { type: integer, nullable: true }

    CourseDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        organizer: { type: string, nullable: true }
        year: { type: integer, nullable: true }

    LanguageDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        level: { type: string, nullable: true }

    SkillCategoryDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillInCategoryDto' }

    SkillInCategoryDto:
      type: object
      properties:
        name: { type: string, nullable: true }
        durationYears: { type: integer, nullable: true }

    AttachmentDto:
      type: object
      properties:
        fileName: { type: string, nullable: true }
        url: { type: string, nullable: true }

    PageResponseConsultantWithCvDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ConsultantWithCvDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }

    PageConsultantWithCvDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ConsultantWithCvDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }

    RelationalSearchRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        skillsAll:
          type: array
          items: { type: string }
        skillsAny:
          type: array
          items: { type: string }
        minQualityScore: { type: integer, nullable: true }
        onlyActiveCv: { type: boolean, default: false }
        minSimilarity:
          type: number
          format: double
          nullable: true
          description: >-
            Cosine similarity in 0..1 below which a hit is discarded. Omit to use the server default;
            pass 0.0 to disable filtering for this request.
        pagination: { $ref: '#/components/schemas/PaginationDto' }

    ChunkRebuildResult:
      type: object
      properties:
        processed: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer, description: Unchanged since the last run. }
        failed: { type: integer }
        totalChunks: { type: integer, description: Chunks written across all processed CVs. }
        provider: { type: string }
        model: { type: string }

    SemanticSearchRequest:
      type: object
      required: [ text ]
      properties:
        text: { type: string }
        provider: { type: string, default: "GOOGLE_GEMINI" }
        model: { type: string, default: "gemini-embedding-001" }
        topK: { type: integer, default: 10 }
        minQualityScore: { type: integer, nullable: true }
        onlyActiveCv: { type: boolean, default: false }
        minSimilarity:
          type: number
          format: double
          nullable: true
          description: >-
            Cosine similarity in 0..1 below which a hit is discarded. Omit to use the server default;
            pass 0.0 to disable filtering for this request.
        pagination: { $ref: '#/components/schemas/PaginationDto' }

    PaginationDto:
      type: object
      properties:
        page: { type: integer, default: 0 }
        size: { type: integer, default: 10 }
        sort:
          type: array
          items: { type: string }

    EmbeddingProviderInfo:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        dimension: { type: integer }
        enabled: { type: boolean }
        activeEmbeddingCount: { type: integer }
        semanticSearchReady: { type: boolean }
        totalConsultantCount: { type: integer, format: int64 }

    ProjectRequestSummaryDto:
      type: object
      description: One request in the matching overview, with how many candidates its run scored.
      required: [ id, customerName, status ]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, nullable: true }
        customerName: { type: string }
        uploadedAt: { type: string, format: date-time, nullable: true, description: When the document was uploaded; null for a request created without one }
        status: { type: string, description: OPEN, IN_PROGRESS or CLOSED }
        coverage:
          $ref: '#/components/schemas/CoverageDto'

    CoverageDto:
      type: object
      description: How many candidates the request's matching run scored. COVERED when at least one, PENDING otherwise.
      required: [ status, label, count ]
      properties:
        status: { type: string, enum: [ COVERED, PENDING ] }
        label: { type: string }
        count: { type: integer }

    PagedMatchesListDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/MatchesListItemDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        currentPage: { type: integer }
        pageSize: { type: integer }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }

    MatchesListItemDto:
      type: object
      required: [ id, coverageStatus, coverageLabel ]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, nullable: true, description: The document's own heading. }
        role:
          type: string
          nullable: true
          description: The position asked for, which is not the same as the document heading.
        customerName: { type: string, nullable: true }
        date: { type: string, format: date-time, nullable: true }
        deadlineDate: { type: string, format: date-time, nullable: true }
        hitCount:
          type: integer
          format: int64
          nullable: true
          description: >-
            Consultants matching at least one of the request's technologies. A recall number, not a
            verdict on whether anybody satisfies the request. Null when the requirements named no
            technology, so a missing basis is never reported as a count of zero.
        coverageStatus: { $ref: '#/components/schemas/CoverageStatus' }
        coverageLabel: { type: string, description: Norwegian label matching coverageStatus. }

    CoverageStatus:
      type: string
      description: >-
        Traffic light over hitCount. GREEN from 5 hits, YELLOW from 2, RED below that including
        zero. NEUTRAL means the count could not be established, which is not the same as zero.
      enum: [ GREEN, YELLOW, RED, NEUTRAL ]

    MatchCandidateDto:
      type: object
      required: [ userId, name, cvId, score ]
      properties:
        userId: { type: string }
        name: { type: string }
        cvId: { type: string }
        score: { type: number, format: double, description: "Match score from 0.0 to 10.0" }
        scorePercent: { type: integer, description: "Match score from 0 to 100" }
        justification: { type: string, nullable: true }
        skills:
          type: array
          items: { type: string }
        email: { type: string, nullable: true }

    TriggerMatchingResponse:
      type: object
      required: [ projectRequestId, status, message ]
      properties:
        projectRequestId: { type: integer, format: int64 }
        status: { type: string }
        message: { type: string }
        jobId: { type: string, nullable: true }

    MatchStatusDto:
      type: object
      required: [ status ]
      properties:
        status: { type: string, description: "PENDING|RUNNING|COMPLETED|FAILED" }
        lastUpdated: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }

    ProjectMatchPreviewResponse:
      type: object
      properties:
        projectRequestId: { type: integer, format: int64 }
        limit: { type: integer }
        semanticSearchReady: { type: boolean }
        semanticSearchUsed: { type: boolean }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/MatchPreviewCandidateDto' }

    MatchPreviewCandidateDto:
      type: object
      description: >-
        A preselected candidate. skillScore, semanticScore, cvQualityScore and combinedScore are all
        on a 0..1 scale where 1 is best; combinedScore is the weighted sum of the other three.
      properties:
        userId: { type: string }
        cvId: { type: string }
        name: { type: string }
        skillScore:
          type: number
          format: double
          nullable: true
          description: >-
            Share of the request's technologies the consultant covers. Null when the request named
            none the corpus recognises, so nothing was measured; that is not the same as 0, which
            means a comparison happened and found no overlap.
        semanticScore: { type: number, format: double }
        cvQualityScore: { type: number, format: double }
        combinedScore: { type: number, format: double }
        reason: { type: string }
        email: { type: string, nullable: true }

    RunMatchingRequest:
      type: object
      description: |
        Optional body for an AI matching run. Naming candidates skips preselection entirely.
        Preselection is a recall filter and its ordering predicts the LLM's ranking poorly, so a
        person picking from the free preview generally has better information than the score.
      properties:
        consultantUserIds:
          type: array
          description: Flowcase user ids from the preview. Absent or empty means use preselection.
          items: { type: string }

    CandidateMatchEvaluation:
      type: object
      description: Full second-stage evaluation of one consultant against a project request.
      required: [ totalScore, summary ]
      properties:
        consultantName: { type: string }
        totalScore:
          type: string
          description: Weighted total on a 0-10 scale, serialised as a string.
        summary: { type: string }
        matchTimeSeconds: { type: integer }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/CandidateMatchRequirement' }
        cvImprovements:
          type: array
          items: { type: string }

    CandidateMatchRequirement:
      type: object
      required: [ name, score ]
      properties:
        name: { type: string }
        isMustHave:
          type: boolean
          description: MÅ-krav count double towards the weighted total.
        score: { type: string }
        justification:
          type: string
          description: Internal, evidence-based reasoning for the score.
        proposalText:
          type: string
          description: Paragraph written to be pasted into an offer.
        yearsOfExperience: { type: string }
        comment: { type: string }

    ProjectMatchStatusResponse:
      type: object
      properties:
        projectRequestId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/MatchingStatus' }
        lastUpdated: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        matchCount: { type: integer }
        semanticSearchReady: { type: boolean }

    MatchingStatus:
      type: string
      enum: [ NOT_STARTED, READY_FOR_PREVIEW, RUNNING, COMPLETED, FAILED ]

    ModelTier:
      type: string
      enum: [ FAST, DEFAULT, QUALITY ]

    ProjectRequestResponseDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        customerName: { type: string, nullable: true }
        title: { type: string, nullable: true }
        role:
          type: string
          nullable: true
          description: >
            The position asked for, in the document's own words. Not the document's heading: a
            tender titled "Tilbudsinnbydelse minikonkurranse" asks for a "Backend utvikler i Team
            Spleiselaget".
        summary: { type: string, nullable: true }
        originalFilename: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time, nullable: true }
        deadlineDate: { type: string, format: date-time, nullable: true }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/RequestStatus' }
        mustRequirements:
          type: array
          items: { $ref: '#/components/schemas/ProjectRequirementDto' }
        shouldRequirements:
          type: array
          items: { $ref: '#/components/schemas/ProjectRequirementDto' }
        aiSuggestions:
          type: array
          items: { $ref: '#/components/schemas/AISuggestionDto' }

    PagedProjectRequestResponseDto:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProjectRequestResponseDto' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        currentPage: { type: integer }
        pageSize: { type: integer }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }

    ProjectRequestDto:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        customerName: { type: string }
        title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        requiredSkills:
          type: array
          items: { type: string }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
        responseDeadline: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/RequestStatus' }
        requestDescription: { type: string, nullable: true }
        responsibleSalespersonEmail: { type: string, format: email, nullable: true }

    RequestStatus:
      type: string
      enum: [ OPEN, IN_PROGRESS, CLOSED ]

    CreateProjectRequestDto:
      type: object
      required: [ customerName, requiredSkills, startDate, endDate, responseDeadline ]
      properties:
        customerName: { type: string }
        requiredSkills:
          type: array
          items: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        responseDeadline: { type: string, format: date-time }
        requestDescription: { type: string, nullable: true }
        responsibleSalespersonEmail: { type: string, format: email, nullable: true }
        status: { $ref: '#/components/schemas/RequestStatus' }

    AISuggestionDto:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        consultantName: { type: string }
        matchScore: { type: number, format: double }
        justification: { type: string }
        createdAt: { type: string, format: date-time }

    ProjectRequirementDto:
      type: object
      required: [ name ]
      properties:
        name: { type: string }
        details: { type: string, nullable: true }
        appliesTo:
          type: string
          enum: [ CONSULTANT, SUPPLIER ]
          default: CONSULTANT
          description: >
            Who has to satisfy it. A tender states requirements for two parties and only the
            consultant's are scored against a CV, so without this the lists say MUST and SHOULD and
            a client cannot tell a competence demand from a submission deadline. Additive: a client
            that ignores it keeps working, and rows extracted before the distinction existed read
            as CONSULTANT, which is how they were treated.

    ReanalyzeResponseDto:
      type: object
      required: [ request, requirementsBefore, requirementsAfter, forConsultant, forSupplier ]
      description: >
        What a re-analysis changed. The counts are the point: a request whose requirements were all
        treated as the consultant's shows up as thirteen before and thirteen after, of which six are
        the supplier's, a change no client could see from the request alone.
      properties:
        request: { $ref: '#/components/schemas/ProjectRequestResponseDto' }
        requirementsBefore: { type: integer }
        requirementsAfter: { type: integer }
        forConsultant: { type: integer }
        forSupplier: { type: integer }

    CvScoreDto:
      type: object
      required: [ candidateId, scorePercent, summary, strengths, potentialImprovements ]
      properties:
        candidateId: { type: string }
        scorePercent: { type: integer }
        summary: { type: string }
        strengths:
          type: array
          items: { type: string }
        potentialImprovements:
          type: array
          items: { type: string }

    CandidateDTO:
      type: object
      required: [ id, name, birthYear ]
      properties:
        id: { type: string }
        name: { type: string }
        score:
          type: integer
          nullable: true
          description: >
            The CV score as a percentage, or null for a candidate nobody has scored yet. Returned
            here so the list can be drawn without asking per candidate.
        summary:
          type: string
          nullable: true
          description: >
            The scoring's own summary of the CV. Lives in the same row as the score, and is returned
            with it for the same reason: the list page used to fetch it one candidate at a time.
        birthYear: { type: integer }

    CvScoringRunResponse:
      type: object
      required: [ processedCount ]
      properties:
        processedCount: { type: integer }

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ UP, DOWN, OUT_OF_SERVICE, UNKNOWN ]
        details:
          type: object
          additionalProperties: { type: string }

    SkillInCompanyDto:
      type: object
      required: [ name, konsulenterMedSkill, konsulenter ]
      properties:
        name: { type: string }
        konsulenterMedSkill: { type: integer }
        konsulenter:
          type: array
          items: { $ref: '#/components/schemas/ConsultantSummaryDto' }

    Problem:
      type: object
      properties:
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }

    # --- Analytics ---
    ProgrammingLanguageStat:
      type: object
      required: [ language, consultantCount, percentage, aggregatedYears ]
      properties:
        language: { type: string }
        consultantCount: { type: integer }
        percentage: { type: number, format: double }
        aggregatedYears: { type: integer }

    RoleStat:
      type: object
      required: [ role, consultantCount, percentage ]
      properties:
        role: { type: string }
        consultantCount: { type: integer }
        percentage: { type: number, format: double }

    # --- Skills (lightweight) ---
    SkillSummaryDto:
      type: object
      required: [ name, consultantCount ]
      properties:
        name: { type: string }
        consultantCount: { type: integer }

    PageSkillSummaryDto:
      type: object
      required: [ content, number, size, totalElements, totalPages, first, last ]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SkillSummaryDto' }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        sort:
          type: object
          additionalProperties: true
        pageable:
          type: object
          additionalProperties: true

    # --- Matches: flat list + top10 + health ---
    MatchItemDto:
      type: object
      required: [ requestId, consultantId, name, score, reasons ]
      properties:
        requestId: { type: integer, format: int64 }
        consultantId: { type: integer, format: int64 }
        name: { type: string }
        score: { type: integer }
        reasons:
          type: array
          items: { type: string }
        profileUrl: { type: string, nullable: true }
        cvQualityPercent: { type: integer, nullable: true }

    MatchTop10ConsultantDto:
      type: object
      required: [ consultantId, consultantName, userId, matchScore, createdAt ]
      properties:
        consultantId: { type: integer, format: int64 }
        consultantName: { type: string }
        userId: { type: string }
        cvId: { type: string, nullable: true }
        matchScore: { type: integer }
        matchExplanation: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    MatchTop10Response:
      type: object
      required: [ projectRequestId, totalMatches, matches ]
      properties:
        projectRequestId: { type: integer, format: int64 }
        projectTitle: { type: string, nullable: true }
        totalMatches: { type: integer }
        matches:
          type: array
          items: { $ref: '#/components/schemas/MatchTop10ConsultantDto' }
        lastUpdated: { type: string, format: date-time, nullable: true }

    MatchesHealthResponse:
      type: object
      required: [ status, service, timestamp ]
      properties:
        status: { type: string, enum: [ UP, DOWN ] }
        service: { type: string }
        projectRequestsCount: { type: integer }
        error: { type: string, nullable: true }
        timestamp: { type: integer, format: int64 }

    # --- Chatbot search ---
    ChatSearchMode:
      type: string
      enum: [ STRUCTURED, SEMANTIC, HYBRID, RAG ]

    ChatSearchRequest:
      type: object
      required: [ text ]
      properties:
        conversationId: { type: string, nullable: true }
        consultantId: { type: string, nullable: true }
        cvId: { type: string, nullable: true }
        text: { type: string }
        forceMode:
          allOf:
            - $ref: '#/components/schemas/ChatSearchMode'
          nullable: true
        topK: { type: integer, nullable: true }

    ChatSearchResultItem:
      type: object
      required: [ consultantId, name, score ]
      properties:
        consultantId: { type: string }
        name: { type: string }
        score: { type: number, format: double }
        highlights:
          type: array
          items: { type: string }
          nullable: true
        meta:
          type: object
          additionalProperties: true
          nullable: true

    ChatSearchSource:
      type: object
      required: [ consultantId, consultantName, chunkId, text, score ]
      properties:
        consultantId: { type: string }
        consultantName: { type: string }
        chunkId: { type: string }
        text: { type: string }
        score: { type: number, format: double }
        location: { type: string, nullable: true }

    ChatSearchResponse:
      type: object
      required: [ mode, results, sources, latencyMs ]
      properties:
        mode: { $ref: '#/components/schemas/ChatSearchMode' }
        results:
          type: array
          items: { $ref: '#/components/schemas/ChatSearchResultItem' }
        answer: { type: string, nullable: true }
        sources:
          type: array
          items: { $ref: '#/components/schemas/ChatSearchSource' }
        latencyMs: { type: integer, format: int64 }
        debug:
          type: object
          additionalProperties: true
          nullable: true
        conversationId: { type: string, nullable: true }
        scoring:
          type: object
          additionalProperties: true
          nullable: true

    ConsultantOfferingStatusDto:
      type: object
      description: Whether a person can be offered to a customer, as somebody decided it.
      required: [ userId, offerable ]
      properties:
        userId: { type: string, description: The Flowcase user id }
        name: { type: string, nullable: true }
        offerable: { type: boolean }
        reason: { type: string, nullable: true, description: Why, in the decider's words }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }

    SetConsultantOfferingStatusRequest:
      type: object
      required: [ offerable ]
      properties:
        offerable: { type: boolean }
        reason: { type: string, nullable: true, description: Stored so the decision can be reviewed, and shown when a run refuses the person }
        decidedBy: { type: string, nullable: true }

    EmbeddingRebuildResult:
      type: object
      required: [ processed, created, updated, skipped, failed, provider, model, dimension ]
      properties:
        processed: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        provider: { type: string }
        model: { type: string }
        dimension: { type: integer }

    ConsultantSkillPageDto:
      type: object
      required: [ content, number, size, totalElements, totalPages, first, last ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ConsultantSummaryDto'
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }

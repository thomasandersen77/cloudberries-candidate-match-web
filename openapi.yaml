openapi: 3.0.3
info:
  title: Cloudberries Candidate Match API
  version: 1.2.0
  description: |
    API for candidate matching, CV retrieval, embeddings, RAG operations, and administrative utilities.
    Includes cost optimization monitoring and asynchronous matching support.
  contact:
    name: Cloudberries
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Admin
    description: Administrative and usage monitoring
  - name: Chat
    description: AI content analysis and RAG
  - name: Skills
    description: Company skills overview
  - name: Consultants
    description: Consultant search, retrieval, and sync
  - name: CV
    description: Consultant CV retrieval
  - name: Embeddings
    description: CV embedding operations
  - name: Health
    description: Health checks
  - name: Matches
    description: Candidate matching and project request analysis
  - name: CV Scoring
    description: CV scoring utilities
  - name: Analytics
    description: Aggregated statistics across consultants (skills, roles, languages)

paths:
  /admin/anthropic-usage:
    get:
      tags: [ Admin ]
      summary: Get Anthropic API usage and cost statistics
      responses:
        '200':
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicUsageResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /chatbot/analyze:
    post:
      tags: [ Chat ]
      summary: Analyze content with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAnalysisRequest'
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIResponseModel'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /rag/chat:
    post:
      tags: [ Chat ]
      summary: Chat with AI using RAG (Retrieval-Augmented Generation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagChatRequest'
      responses:
        '200':
          description: Chat response with sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagChatResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /rag/ingest:
    post:
      tags: [ Chat ]
      summary: Ingest a CV into the RAG vector store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagIngestRequest'
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested:
                    type: integer
        default:
          $ref: '#/components/responses/ErrorResponse'

  /rag/ingest/db:
    post:
      tags: [ Chat ]
      summary: Ingest all CVs from the database into the RAG vector store
      responses:
        '200':
          description: Batch ingestion report
          content:
            application/json:
              schema:
                type: object
                properties:
                  rowsProcessed:
                    type: integer
                  chunksAdded:
                    type: integer
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants:
    get:
      tags: [ Consultants ]
      summary: List consultants (paged)
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Optional name filter (contains)
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paged consultants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageConsultantSummaryDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/with-cv:
    get:
      tags: [ Consultants ]
      summary: Get all consultants with their CVs
      parameters:
        - in: query
          name: onlyActiveCv
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of consultants with CVs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsultantWithCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/with-cv/paged:
    get:
      tags: [ Consultants ]
      summary: Get paged consultants with their CVs
      parameters:
        - in: query
          name: onlyActiveCv
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paged consultants with CVs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseConsultantWithCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/{userId}/cvs:
    get:
      tags: [ Consultants ]
      summary: List CVs for a specific consultant
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: onlyActiveCv
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of consultant CVs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsultantCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/search:
    post:
      tags: [ Consultants ]
      summary: Relational search for consultants
      operationId: searchConsultantsRelational
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationalSearchRequest'
      responses:
        '200':
          description: Paged consultants matching filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageConsultantWithCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/search/semantic:
    post:
      tags: [ Consultants ]
      summary: Semantic (vector) search for consultants
      operationId: searchConsultantsSemantic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticSearchRequest'
      responses:
        '200':
          description: Paged semantically similar consultants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageConsultantWithCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/search/embedding-info:
    get:
      tags: [ Consultants ]
      summary: Get information about the configured embedding provider
      responses:
        '200':
          description: Embedding provider info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProviderInfo'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/sync/run:
    post:
      tags: [ Consultants ]
      summary: Trigger a sync from Flowcase
      parameters:
        - in: query
          name: batchSize
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Sync summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /cv/{userId}:
    get:
      tags: [ CV ]
      summary: Get a consultant's CV (raw JSON)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CV data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /embeddings/run/missing:
    post:
      tags: [ Embeddings ]
      summary: Generate embeddings for users missing vectors
      parameters:
        - in: query
          name: batchSize
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  processedCount:
                    type: integer
                  batchSize:
                    type: integer
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests:
    get:
      tags: [ Matches ]
      summary: List all project requests available for matching
      responses:
        '200':
          description: List of project request summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectRequestSummaryDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests-paged:
    get:
      tags: [ Matches ]
      summary: List project requests with coverage information (paged)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sort
          schema: { type: string, default: "uploadedAt,desc" }
      responses:
        '200':
          description: Paged project requests with coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMatchesListDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{id}/top-consultants:
    get:
      tags: [ Matches ]
      summary: Returns AI-enriched top consultants for a given project request
      deprecated: true
      description: >
        Returns previously persisted LLM evaluation when present (no LLM call).
        On first access, triggers a fresh LLM run and persists the result.
        To force a fresh run, use `POST /matches/requests/{id}/re-analyze`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 5, minimum: 1, maximum: 10 }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '200':
          description: List of AI-enriched matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchCandidateDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{id}/re-analyze:
    post:
      tags: [ Matches ]
      summary: Re-analyzes and re-ranks consultants for a project request
      deprecated: true
      description: >
        Forces a fresh LLM evaluation and overwrites the cached result for the
        given project request. Use this for an explicit "Run again" action from
        the UI when the user wants updated matches.
        DEPRECATED: Use `POST /matches/requests/{id}/matches/run` instead.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '200':
          description: Re-analysis results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchCandidateDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{id}/matches/preview:
    get:
      tags: [ Matches ]
      deprecated: true
      summary: Cheap candidate shortlist generation without LLM reasoning
      description: >
        Uses pgvector and skill matching to generate a quick preview of potential candidates.
        Does not call expensive LLMs.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: List of potential matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchCandidateDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{id}/matches/run:
    post:
      tags: [ Matches ]
      deprecated: true
      summary: Explicitly triggers expensive AI matching for a shortlist
      description: >
        Triggers LLM reasoning for the top candidates identified for this project request.
        Persists results for later retrieval.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '200':
          description: List of AI-enriched matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchCandidateDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{projectRequestId}/trigger:
    post:
      tags: [ Matches ]
      deprecated: true
      summary: Trigger matching computation for a specific project request
      parameters:
        - in: path
          name: projectRequestId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: forceRecompute
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '200':
          description: Trigger status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerMatchingResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/status/{requestId}:
    get:
      tags: [ Matches ]
      deprecated: true
      summary: Get the status of a matching job
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Match status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatusDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/recalculate/{requestId}:
    post:
      tags: [ Matches ]
      summary: Recalculate matches for a project request (Async)
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '202':
          description: Recalculation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: integer }
                  statusUrl: { type: string }
                  matchesUrl: { type: string }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/trigger-all:
    post:
      tags: [ Matches ]
      summary: Trigger matching for all project requests
      parameters:
        - in: query
          name: forceRecompute
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: Batch operation status
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests:
    get:
      tags: [ Project Requests ]
      summary: List all project requests (paged)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sort
          schema: { type: string, default: "id,desc" }
      responses:
        '200':
          description: Paged list of project requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProjectRequestResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [ Project Requests ]
      summary: Create a new project request
      parameters:
        - in: query
          name: async
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequestDto'
      responses:
        '201':
          description: Created project request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestDto'
        '202':
          description: Accepted for async processing
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/upload:
    post:
      tags: [ Project Requests ]
      summary: Upload and analyze a customer project request PDF
      parameters:
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Extracted project request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}:
    get:
      tags: [ Project Requests ]
      summary: Get project request by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Project request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestResponseDto'
        '404':
          description: Project request not found
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [ Project Requests ]
      summary: Delete a project request permanently
      description: >
        Permanently deletes the project request with the given id, including all associated
        requirements, AI suggestions and computed matches. Returns 204 on success, 404 if not found.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Project request deleted successfully
        '404':
          description: Project request not found
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/analyze:
    post:
      tags: [ Project Requests ]
      deprecated: true
      summary: Trigger AI analysis for an existing project request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches:
    get:
      tags: [ Matches ]
      summary: Get persisted matching results for a project request
      description: |
        Returns stored match results without triggering any new LLM computation.
        Safe to call on page load or expand.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: List of stored candidate matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MatchCandidateDto' }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches/preview:
    get:
      tags: [ Matches ]
      summary: Cheap shortlist / preselection for a project request
      description: |
        Returns a shortlist of candidates based on skills and semantic similarity.
        Does NOT call Anthropic or any LLM.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Shortlist preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMatchPreviewResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches/run:
    post:
      tags: [ Matches ]
      summary: Explicitly run AI matching for a project request
      description: |
        Triggers LLM-based matching for a shortlist of candidates.
        This is an expensive operation.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - in: query
          name: modelTier
          schema: { $ref: '#/components/schemas/ModelTier' }
        - in: query
          name: cvWeightPercent
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: AI matching results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MatchCandidateDto' }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches/status:
    get:
      tags: [ Matches ]
      summary: Get normalized matching status
      description: Returns the current status of matching for the project request.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Matching status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMatchStatusResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/suggestions:
    get:
      tags: [ Project Requests ]
      summary: Get AI suggestions for a project request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: List of AI suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AISuggestionDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/close:
    put:
      tags: [ Project Requests ]
      summary: Close a project request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Closed project request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /cv-score/{candidateId}:
    get:
      tags: [ CV Scoring ]
      summary: Get CV score for a candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Candidate CV score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvScoreDto'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [ CV Scoring ]
      summary: Trigger scoring for single candidate
      operationId: scoreCandidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema: { type: string }
        - in: query
          name: aiProvider
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: Updated candidate CV score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvScoreDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /cv-score/{candidateId}/run:
    post:
      tags: [ CV Scoring ]
      summary: Trigger scoring run for single candidate
      operationId: runScoreForCandidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema: { type: string }
        - in: query
          name: aiProvider
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: Updated candidate CV score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvScoreDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /cv-score/{candidateId}/recalculate:
    post:
      tags: [ CV Scoring ]
      summary: Recalculate CV score for a single candidate
      operationId: recalculateScore
      parameters:
        - in: path
          name: candidateId
          required: true
          schema: { type: string }
        - in: query
          name: aiProvider
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: Updated candidate CV score
          content:
            application/json:
              schema:

openapi: 3.0.3
info:
  title: Cloudberries Candidate Match API
  version: 1.2.0
  description: |
    API for candidate matching, CV retrieval, embeddings, the grounded chat, and administrative utilities.
    Includes cost optimization monitoring and asynchronous matching support.
  contact:
    name: Cloudberries
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Admin
    description: Administrative and usage monitoring
  - name: Chat
    description: AI content analysis and RAG
  - name: Skills
    description: Company skills overview
  - name: Consultants
    description: Consultant search, retrieval, and sync
  - name: CV
    description: Consultant CV retrieval
  - name: Embeddings
    description: CV embedding operations
  - name: Health
    description: Health checks
  - name: Matches
    description: Candidate matching and project request analysis
  - name: CV Scoring
    description: CV scoring utilities
  - name: Analytics
    description: Aggregated statistics across consultants (skills, roles, languages)

paths:
  /project-requests/{id}/document-kind:
    put:
      tags: [ ProjectRequests ]
      summary: Record what kind of document a project request came from
      description: >
        The upload cannot establish this, and a filename heuristic would put a weak inference in the
        database looking authoritative, so it is a decision someone makes. Until it is made the
        value is UNKNOWN and answers about the request say the kind is unverified rather than
        presenting a proposal's contents as a customer's demands.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDocumentKindRequest'
      responses:
        '200':
          description: The recorded kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestDocumentKindDto'
        '404':
          description: No such project request
        default:
          $ref: '#/components/responses/ErrorResponse'

  /chatbot/analyze:
    post:
      tags: [ Chat ]
      summary: Ask a question about consultants and customer requests
      description: >
        Answers from the database. The evidence is selected before the model is called and returned
        alongside the answer, so the caller can show what it rested on. Omit conversationId to start
        a conversation; send back the one in the response to continue it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatAnalyzeRequest'
      responses:
        '200':
          description: A grounded answer with its sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAnalyzeResponse'
        '400':
          description: Empty or oversized content
        default:
          $ref: '#/components/responses/ErrorResponse'

  /chatbot/analyze/{conversationId}:
    delete:
      tags: [ Chat ]
      summary: Forget a conversation
      description: Deletes its turns and the entities it was about.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Forgotten
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants:
    get:
      tags: [ Consultants ]
      summary: List consultants (paged)
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Optional name filter (contains)
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paged consultants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageConsultantSummaryDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/with-cv:
    get:
      tags: [ Consultants ]
      summary: Get all consultants with their CVs
      parameters:
        - in: query
          name: onlyActiveCv
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of consultants with CVs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsultantWithCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/with-cv/paged:
    get:
      tags: [ Consultants ]
      summary: Get paged consultants with their CVs
      parameters:
        - in: query
          name: onlyActiveCv
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paged consultants with CVs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseConsultantWithCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/{userId}/with-cv:
    get:
      tags: [ Consultants ]
      summary: Get one consultant with CV data
      operationId: getConsultantWithCv
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: onlyActiveCv
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Consultant with CV data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultantWithCvDto'
        '404':
          description: Consultant not found
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/{userId}/cvs:
    get:
      tags: [ Consultants ]
      summary: List CVs for a specific consultant
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: onlyActiveCv
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of consultant CVs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsultantCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/search:
    post:
      tags: [ Consultants ]
      summary: Relational search for consultants
      operationId: searchConsultantsRelational
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationalSearchRequest'
      responses:
        '200':
          description: Paged consultants matching filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageConsultantWithCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/search/semantic:
    post:
      tags: [ Consultants ]
      summary: Semantic (vector) search for consultants
      operationId: searchConsultantsSemantic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticSearchRequest'
      responses:
        '200':
          description: Paged semantically similar consultants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageConsultantWithCvDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/search/embedding-info:
    get:
      tags: [ Consultants ]
      summary: Get information about the configured embedding provider
      responses:
        '200':
          description: Embedding provider info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProviderInfo'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/sync/run:
    post:
      tags: [ Consultants ]
      summary: Trigger a sync from Flowcase
      parameters:
        - in: query
          name: batchSize
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Sync summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/sync/{userId}/{cvId}:
    post:
      tags: [ Consultants ]
      summary: Synchronize one consultant and the current CV from Flowcase
      operationId: syncSingleConsultant
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: cvId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Single consultant sync summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultantSyncResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /cv/{userId}:
    get:
      tags: [ CV ]
      summary: Get a consultant's CV (raw JSON)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CV data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /consultants/embeddings/chunks/rebuild:
    post:
      tags: [ Embeddings ]
      summary: Build the per-section CV chunk corpus used by chunked semantic search
      description: >-
        Splits every eligible CV into semantic chunks (one per project experience and key
        qualification, plus skills and credentials) and embeds each one. Must be run once before
        `embedding.chunking.enabled` has any effect; until chunks exist, semantic search falls back
        to whole-CV vectors on its own. Safe to re-run: unchanged CVs are skipped by content hash,
        and a provider rate limit stops the run cleanly so a later run resumes where it left off.
      operationId: rebuildCvChunks
      parameters:
        - in: query
          name: force
          schema:
            type: boolean
            default: false
          description: Re-embed even when the CV content hash is unchanged.
        - in: query
          name: limit
          schema:
            type: integer
          description: Cap the number of consultants processed, for a partial run.
      responses:
        '200':
          description: Chunk rebuild summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunkRebuildResult' }

  /embeddings/run/missing:
    post:
      tags: [ Embeddings ]
      summary: Generate embeddings for users missing vectors
      parameters:
        - in: query
          name: batchSize
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  processedCount:
                    type: integer
                  batchSize:
                    type: integer
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests:
    get:
      tags: [ Matches ]
      summary: List all project requests available for matching
      responses:
        '200':
          description: List of project request summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectRequestSummaryDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests-paged:
    get:
      tags: [ Matches ]
      summary: List project requests with coverage information (paged)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sort
          schema: { type: string, default: "uploadedAt,desc" }
      responses:
        '200':
          description: Paged project requests with coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMatchesListDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{id}/top-consultants:
    get:
      tags: [ Matches ]
      summary: Returns AI-enriched top consultants for a given project request
      deprecated: true
      description: >
        Returns previously persisted LLM evaluation when present (no LLM call).
        On first access, triggers a fresh LLM run and persists the result.
        To force a fresh run, use `POST /matches/requests/{id}/re-analyze`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 5, minimum: 1, maximum: 10 }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '200':
          description: List of AI-enriched matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchCandidateDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{id}/re-analyze:
    post:
      tags: [ Matches ]
      summary: Re-analyzes and re-ranks consultants for a project request
      deprecated: true
      description: >
        Forces a fresh LLM evaluation and overwrites the cached result for the
        given project request. Use this for an explicit "Run again" action from
        the UI when the user wants updated matches.
        DEPRECATED: Use `POST /matches/requests/{id}/matches/run` instead.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '200':
          description: Re-analysis results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchCandidateDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{id}/matches/preview:
    get:
      tags: [ Matches ]
      deprecated: true
      summary: Cheap candidate shortlist generation without LLM reasoning
      description: >
        Uses pgvector and skill matching to generate a quick preview of potential candidates.
        Does not call expensive LLMs.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: List of potential matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchCandidateDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{id}/matches/run:
    post:
      tags: [ Matches ]
      deprecated: true
      summary: Explicitly triggers expensive AI matching for a shortlist
      description: >
        Triggers LLM reasoning for the top candidates identified for this project request.
        Persists results for later retrieval.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '200':
          description: List of AI-enriched matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchCandidateDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/requests/{projectRequestId}/trigger:
    post:
      tags: [ Matches ]
      deprecated: true
      summary: Trigger matching computation for a specific project request
      parameters:
        - in: path
          name: projectRequestId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: forceRecompute
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '200':
          description: Trigger status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerMatchingResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/status/{requestId}:
    get:
      tags: [ Matches ]
      deprecated: true
      summary: Get the status of a matching job
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Match status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatusDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/recalculate/{requestId}:
    post:
      tags: [ Matches ]
      summary: Recalculate matches for a project request (Async)
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/ModelTierParam'
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - $ref: '#/components/parameters/CvWeightPercentParam'
      responses:
        '202':
          description: Recalculation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: integer }
                  statusUrl: { type: string }
                  matchesUrl: { type: string }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /matches/trigger-all:
    post:
      tags: [ Matches ]
      summary: Trigger matching for all project requests
      parameters:
        - in: query
          name: forceRecompute
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: Batch operation status
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests:
    get:
      tags: [ Project Requests ]
      summary: List all project requests (paged)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sort
          schema: { type: string, default: "id,desc" }
      responses:
        '200':
          description: Paged list of project requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProjectRequestResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [ Project Requests ]
      summary: Create a new project request
      parameters:
        - in: query
          name: async
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequestDto'
      responses:
        '201':
          description: Created project request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestDto'
        '202':
          description: Accepted for async processing
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/upload:
    post:
      tags: [ Project Requests ]
      summary: Upload and analyze a customer project request document
      description: |
        Accepts PDF and Word (.docx). The format is decided by the file's own leading bytes, not by
        its name or the content-type the browser guessed, so a mis-named file still reads correctly
        and a file that is neither is refused with a message rather than a parser error.

        Word is accepted because customers send it: converting a .docx to PDF first is not
        equivalent. Measured on a real tender, that detour kept 17 217 of 61 570 characters and
        destroyed every Norwegian vowel.
      parameters:
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                  description: The customer's document, .pdf or .docx, at most 10 MB.
      responses:
        '400':
          description: The file is neither a PDF nor a readable Word document
        '200':
          description: Extracted project request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}:
    get:
      tags: [ Project Requests ]
      summary: Get project request by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Project request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestResponseDto'
        '404':
          description: Project request not found
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [ Project Requests ]
      summary: Delete a project request permanently
      description: >
        Permanently deletes the project request with the given id, including all associated
        requirements, AI suggestions and computed matches. Returns 204 on success, 404 if not found.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Project request deleted successfully
        '404':
          description: Project request not found
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/analyze:
    post:
      tags: [ Project Requests ]
      deprecated: true
      summary: Score the shortlist against this request and answer with the result
      description: |
        A way into the one matching pipeline, kept for the detail page's «Analyser (AI)» button.
        Runs a fresh interactive matching run (`forceRecompute`, never a batch) and returns the
        request with the scored candidates in `aiSuggestions`; the same run is what
        `/matches/requests/{id}/top-consultants` reads. Prefer the matching endpoints for new
        clients. This used to run a second pipeline of its own with a different prompt, shortlist
        and cut-off, which is why it is deprecated.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRequestResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/reanalyze-document:
    post:
      tags: [ Project Requests ]
      summary: Re-run the requirement extraction over the request's stored document text
      description: |
        Distinct from `/analyze`, which suggests consultants and touches no requirement. This one
        reads the document text already stored for the request and replaces its requirement list,
        so a request analysed before a change to the extraction can be brought forward without the
        original PDF.

        It cannot repair the stored text itself. A document uploaded before line breaks were
        preserved is one unbroken run of words in the database, and re-reading it recovers no list
        structure; those need uploading again.

        Replaces the requirement list only. Customer name, title and summary are left as they are,
        since a person may have corrected them.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: What the re-analysis changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReanalyzeResponseDto'
        '404':
          description: No request with that id
        '409':
          description: The request has no stored document text to read
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches:
    get:
      tags: [ Matches ]
      summary: Get persisted matching results for a project request
      description: |
        Returns stored match results without triggering any new LLM computation.
        Safe to call on page load or expand.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: List of stored candidate matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MatchCandidateDto' }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches/preview:
    get:
      tags: [ Matches ]
      summary: Cheap shortlist / preselection for a project request
      description: |
        Returns a shortlist of candidates based on skills and semantic similarity.
        Does NOT call Anthropic or any LLM.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Shortlist preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMatchPreviewResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches/run:
    post:
      tags: [ Matches ]
      summary: Explicitly run AI matching for a project request
      description: |
        Triggers LLM-based matching for a shortlist of candidates.
        This is an expensive operation.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
        - in: query
          name: modelTier
          schema: { $ref: '#/components/schemas/ModelTier' }
        - in: query
          name: cvWeightPercent
          schema: { type: integer, minimum: 0, maximum: 100 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunMatchingRequest'
      responses:
        '200':
          description: AI matching results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MatchCandidateDto' }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches/{consultantUserId}/proposal:
    post:
      tags: [ Matches ]
      summary: Generate the offer-ready evaluation for one consultant
      description: |
        Second matching stage. `/matches/run` scores the shortlist with a screening prompt,
        because only the score and the summary are stored; the per-requirement justifications and
        the proposal paragraphs are roughly four fifths of the output tokens. Call this once a
        consultant has been picked to bid.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: consultantUserId
          required: true
          description: Flowcase user id, as returned in `MatchCandidateDto.id`.
          schema: { type: string }
        - in: query
          name: modelTier
          schema: { $ref: '#/components/schemas/ModelTier' }
        - $ref: '#/components/parameters/UseHighestQualityModelParam'
      responses:
        '200':
          description: Full candidate evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateMatchEvaluation'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /project-requests/{id}/matches/status:
    get:
      tags: [ Matches ]
      summary: Get normalized matching status
      description: Returns the current status of matching for the project request.
      parameters:
